<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="FiscalScope">
  <!--
    La escala progresiva, que es el asunto de la publicación: tres tramos que
    suben y el último en el verde de la casa. Dibujado con los mismos colores
    del papel, no con los de una librería de iconos.
    Se adapta al modo oscuro del sistema; donde no se soporte, se queda en claro.
  -->
  <style>
    .fondo { fill: #edebe4; }
    .linea { fill: #c4c8c8; }
    .tramo { fill: #16191b; }
    .alto  { fill: #0b5560; }
    @media (prefers-color-scheme: dark) {
      .fondo { fill: #0e1214; }
      .linea { fill: #232a2d; }
      .tramo { fill: #e8e6df; }
      .alto  { fill: #58a4af; }
    }
  </style>
  <rect class="fondo" width="32" height="32" rx="6" />
  <rect class="tramo" x="5"    y="19" width="6.6" height="7" />
  <rect class="tramo" x="12.7" y="14" width="6.6" height="12" />
  <rect class="alto"  x="20.4" y="8"  width="6.6" height="18" />
  <rect class="linea" x="4"    y="26" width="24"  height="1.4" />
</svg>
